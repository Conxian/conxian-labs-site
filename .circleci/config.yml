# CircleCI lane: activates as soon as the project is set up in CircleCI.
version: 2.1
jobs:
  verify:
    docker:
      - image: cimg/node:26.13.1
    resource_class: medium
    steps:
      - checkout
      - restore_cache:
          keys:
            - npm-{{ checksum "package-lock.json" }}
      - run:
          name: install
          command: npm ci --no-audit --no-fund
      - save_cache:
          key: npm-{{ checksum "package-lock.json" }}
          paths:
            - node_modules
      - run:
          name: build
          command: npm run build
workflows:
  ci:
    jobs: [verify]
