services:
  - type: web
    name: conxian-labs-site
    env: node
    region: oregon
    buildCommand: "npm install"
    startCommand: "npm start"
    plan: free
    healthCheckPath: /api/health
    pullRequestPreviewsEnabled: yes
    autoDeploy: yes
    envVars:
      # Managed SaaS Gateway subscriber onboarding.
      # Per ADR-009 the gateway is the single monetization surface and the
      # Lightning subscription rail is the sanctioned crypto-native checkout
      # (no card-network Merchant of Record). MANAGED_BILLING_BASE_URL is the
      # gate: its absence means no payment rail, and the managed tier stays
      # unavailable. Left unset deliberately — the previous placeholder host
      # (api.conxian-labs.com) does not serve a managed endpoint, so declaring
      # it would advertise an unqualified purchase path.
      - key: MANAGED_BILLING_BASE_URL
        sync: false
      # Optional override for the delivery endpoint when the delivery host
      # differs from the billing base. Unset = the billing base is used.
      - key: MANAGED_GATEWAY_ENDPOINT
        sync: false
      # Optional intake endpoint for gated access requests (a restricted system,
      # never Git). When unset, POST /api/onboarding/request-access fails closed
      # and returns a mailto fallback instead of claiming a stored record.
      - key: ACCESS_REQUEST_ENDPOINT
        sync: false

