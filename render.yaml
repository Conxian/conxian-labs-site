services:
  - type: static
    name: conxian-labs-static-v1
    env: static
    region: oregon
    buildCommand: "npm install && npm run test"
    publishPath: "."
    pullRequestPreviewsEnabled: yes
    autoDeploy: yes
    headers:
      - path: "/*"
        name: X-Frame-Options
        value: DENY
      - path: "/*"
        name: X-Content-Type-Options
        value: nosniff
      - path: "/*"
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';"
      - path: "/*"
        name: Referrer-Policy
        value: "strict-origin-when-cross-origin"
      - path: "/*"
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocations=()"
    routes:
      - type: rewrite
        source: "/sdk/*"
        destination: "/sdk/index.html"
      - type: rewrite
        source: "/docs/*"
        destination: "/docs/index.html"
      - type: rewrite
        source: "/pricing/*"
        destination: "/pricing/index.html"
      - type: rewrite
        source: "/partners/*"
        destination: "/partners/index.html"
      - type: rewrite
        source: "/operators/*"
        destination: "/operators/index.html"
      - type: rewrite
        source: "/enterprise/*"
        destination: "/enterprise/index.html"
      - type: rewrite
        source: "/terms/*"
        destination: "/terms/index.html"
