name: CI

on:
  push:
    branches: [ main, staged, dev ]
  pull_request:
    branches: [ main, staged, dev ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Run branch promotion policy unit tests
      env:
        PYTHONDONTWRITEBYTECODE: '1'
      run: python3 -m unittest scripts.tests.test_branch_promotion_policy

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 26
        cache: 'npm'

    - name: Install dependencies
      run: npm install

    - name: Verify managed onboarding API boundaries
      run: npm run test:api

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run tests
      run: npm test

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Run Gitleaks
      run: |
        set -euo pipefail
        VERSION="8.18.2"
        ARCHIVE="gitleaks_${VERSION}_linux_x64.tar.gz"
        URL="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ARCHIVE}"
        # Download the release archive with retries and verify it is a real gzip
        # before extracting. GitHub intermittently serves an HTML error page,
        # which previously produced "gzip: stdin: not in gzip format" failures.
        for attempt in 1 2 3 4 5; do
          curl -sSL --retry 5 --retry-all-errors --retry-delay 3 "$URL" -o "$ARCHIVE"
          if gzip -t "$ARCHIVE" 2>/dev/null; then
            break
          fi
          echo "::warning::gitleaks download attempt ${attempt} was not a valid archive; retrying"
          rm -f "$ARCHIVE"
          sleep $((attempt * 3))
        done
        if [ ! -s "$ARCHIVE" ] || ! gzip -t "$ARCHIVE" 2>/dev/null; then
          echo "::error::Unable to download a valid gitleaks archive from ${URL}"
          exit 1
        fi
        tar xzf "$ARCHIVE"
        ./gitleaks detect --source . -v
