name: Dependency Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '**/package-lock.json'
      - '**/yarn.lock'
      - '**/pnpm-lock.yaml'
      - '**/Cargo.lock'
      - '**/Gemfile.lock'
      - '**/go.sum'
      - '**/composer.lock'

permissions:
  contents: read

jobs:
  dependency-review:
    uses: Conxian/.github/.github/workflows/dependency-review.yml@main
    permissions:
      contents: read
      pull-requests: write
    with:
      base-ref: ${{ github.event.pull_request.base.sha }}
      head-ref: ${{ github.event.pull_request.head.sha }}
