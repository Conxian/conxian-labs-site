# GitLab CI is the primary free build lane; GitHub Actions is billing-locked.
stages: [test]
default:
  interruptible: true
test:
  stage: test
  image: node:26-bookworm-slim
  cache:
    key: npm-labs-site-$CI_COMMIT_REF_SLUG
    paths: [node_modules]
  script:
    - node --version
    - npm ci --no-audit --no-fund
    - npm run test:api
